<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff;
      --card: #f9fafb;
      --line: #e5e8eb;
      --text: #191f28;
      --sub: #6b7684;
      --hint: #8b95a1;
      --blue: #3182f6;
      --blue-press: #1b64da;
      --blue-weak: #e8f3ff;
      --track: #e5e8eb;
      --red: #f04452;
      --red-weak: #ffeeee;
      --btn: #f2f4f6;
      --btn-press: #e5e8eb;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171c;
        --card: #202027;
        --line: #2c2c35;
        --text: #f2f4f6;
        --sub: #9e9ea4;
        --hint: #7e7e87;
        --blue: #3182f6;
        --blue-press: #4593fc;
        --blue-weak: #1f2b3d;
        --track: #3a3a44;
        --red: #f66570;
        --red-weak: #3a2227;
        --btn: #2c2c35;
        --btn-press: #3a3a44;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    [hidden] { display: none !important; }

    /* 헤더 */
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 4px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; user-select: none; cursor: default; }
    .brand img { width: 22px; height: 22px; }
    @media (prefers-color-scheme: dark) {
      .brand img { background: #fff; border-radius: 7px; padding: 3px; width: 26px; height: 26px; }
    }
    .demo { font-size: 10px; font-weight: 700; letter-spacing: .03em; color: #f76707; background: rgba(247, 103, 7, .15); padding: 2px 7px; border-radius: 99px; }
    .admin { font-size: 11px; font-weight: 600; color: var(--blue); background: var(--blue-weak); padding: 2px 8px; border-radius: 99px; }

    /* 토글 스위치 */
    .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); cursor: pointer; }
    .switch input { display: none; }
    .switch .knob { position: relative; width: 40px; height: 24px; border-radius: 99px; background: var(--track); transition: background .2s; }
    .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.3,.7,.4,1); }
    .switch input:checked + .knob { background: var(--blue); }
    .switch input:checked + .knob::after { transform: translateX(16px); }

    main { padding: 8px 20px 20px; }

    /* 상태 */
    .hero { padding: 12px 0 20px; }
    .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; margin-bottom: 8px; color: var(--blue); background: var(--blue-weak); }
    .chip.mine { color: #e07c00; background: rgba(255, 159, 41, .14); }
    .hero h1 { font-size: 22px; line-height: 1.35; font-weight: 700; margin: 0 0 4px; word-break: keep-all; overflow-wrap: anywhere; }
    .hero p { margin: 0; color: var(--sub); font-size: 14px; word-break: keep-all; }

    .empty { text-align: center; padding: 28px 8px 24px; }
    .empty .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; background: var(--card); display: grid; place-items: center; }
    .empty h1 { font-size: 19px; }

    /* 버튼 */
    .primary {
      width: 100%; height: 52px; border-radius: 14px; background: var(--blue); color: #fff;
      font-size: 16px; font-weight: 600; transition: background .15s, transform .1s;
    }
    .primary:hover { background: var(--blue-press); }
    .primary:active { transform: scale(.98); }
    .drop-hint { text-align: center; font-size: 12px; color: var(--hint); margin: 8px 0 0; }
    body.dragging .primary { background: var(--blue-press); box-shadow: 0 0 0 4px var(--blue-weak); }

    .help-link { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: none; }
    .help-link:hover { text-decoration: underline; }
    .list-btn {
      width: 100%; height: 44px; margin-top: 10px; border-radius: 12px; background: var(--btn); color: var(--text);
      display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .list-btn:hover { background: var(--btn-press); }
    .list-btn kbd { margin-left: 2px; }

    /* 카드 */
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-top: 12px; }
    .card-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 12px; }
    .text-btn { font-size: 13px; font-weight: 500; color: var(--hint); padding: 2px 4px; border-radius: 6px; }
    .text-btn:hover { color: var(--text); }

    /* 싱크 */
    .sync { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .sync .value { flex: 1; min-width: 0; white-space: nowrap; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sync .value small { font-size: 15px; font-weight: 600; color: var(--sub); margin-left: 2px; }
    .step { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--btn); font-size: 13px; font-weight: 600; color: var(--sub); transition: background .15s, transform .1s; }
    .step:hover { background: var(--btn-press); color: var(--text); }
    .step:active { transform: scale(.94); }
    .sync-hint { margin: 10px 0 0; font-size: 12px; color: var(--hint); text-align: center; }
    kbd { font: 600 11px/1 inherit; padding: 2px 5px; border-radius: 4px; background: var(--btn); color: var(--sub); }

    /* 미리보기 */
    .preview {
      position: relative; height: 88px; border-radius: 12px; overflow: hidden; margin-bottom: 16px;
      background: linear-gradient(135deg, #2b3a55, #1c2333);
    }
    .preview span {
      position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
      color: #fff; font-weight: 600; padding: 1px 8px; border-radius: 3px;
      text-shadow: 0 0 3px #000;
    }

    /* 슬라이더 */
    .field { margin-top: 14px; }
    .field:first-of-type { margin-top: 0; }
    .field-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .field-head output { color: var(--blue); font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; outline: none; margin: 8px 0;
      background: linear-gradient(to right, var(--blue) var(--p, 50%), var(--track) var(--p, 50%));
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff;
      box-shadow: var(--shadow); border: 0; cursor: pointer; transition: transform .1s;
    }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }

    /* 하단 */
    .footer { display: flex; gap: 8px; margin-top: 12px; }
    .footer button { flex: 1; height: 44px; border-radius: 12px; background: var(--btn); font-size: 14px; font-weight: 600; color: var(--sub); transition: background .15s, color .15s; }
    .footer button:hover { background: var(--btn-press); color: var(--text); }
    .footer .danger.armed { background: var(--red-weak); color: var(--red); }
    .footer .accent { background: var(--blue-weak); color: var(--blue); }


    /* 관리자 카드 */
    .admin-card { border: 1.5px dashed var(--line); background: transparent; }
    .kv { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 14px; }
    .kv + .kv { border-top: 1px solid var(--line); }
    .kv .k { color: var(--sub); flex: none; }
    .kv .v { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy { flex: none; font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-weak); padding: 3px 8px; border-radius: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); flex: none; }
    .dot.ok { background: #1bc47d; }
    .dot.no { background: #ff9f29; }
    .dot.err { background: var(--red); }
    .admin-actions { display: flex; gap: 8px; margin-top: 12px; }
    .admin-actions button, .admin-actions a {
      flex: 1; height: 40px; border-radius: 10px; display: grid; place-items: center; text-decoration: none;
      font-size: 13px; font-weight: 600; background: var(--btn); color: var(--sub); transition: background .15s, color .15s;
    }
    .admin-actions button:hover, .admin-actions a:hover { background: var(--btn-press); color: var(--text); }
    .admin-actions .accent { background: var(--blue-weak); color: var(--blue); }
    .admin-note { margin: 10px 0 0; font-size: 12px; color: var(--hint); word-break: keep-all; }

    .copyright { text-align: center; font-size: 11px; color: var(--hint); margin: 16px 0 0; }

    /* 토스트 */
    .toast {
      position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 12px); opacity: 0;
      max-width: 300px; padding: 10px 16px; border-radius: 12px; background: rgba(25, 31, 40, .92); color: #fff;
      font-size: 13px; text-align: center; transition: opacity .2s, transform .2s; pointer-events: none; word-break: keep-all;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header>
    <div class="brand" id="title">
      <img src="icons/icon32.png" alt="" />
      iSubby
      <span class="demo">DEMO</span>
      <span id="adminBadge" class="admin" hidden>관리자</span>
    </div>
    <label class="switch" title="자막 켜기/끄기 (Shift+S)">
      <span id="visibleLabel">자막</span>
      <input type="checkbox" id="visible" />
      <span class="knob"></span>
    </label>
  </header>

  <main>
    <!-- 플레이어 없음 -->
    <section id="noPlayer" class="empty" hidden>
      <div class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="#b0b8c1"/></svg>
      </div>
      <div class="hero" style="padding:0">
        <h1 id="emptyTitle">강의 영상을 열어주세요</h1>
        <p id="emptyText">iCampus 강의 영상 페이지에서<br />자막을 띄울 수 있어요</p>
        <a class="help-link" id="helpLink" href="#" hidden>문제 알리기</a>
      </div>
    </section>

    <!-- 플레이어 연결됨 -->
    <section id="player" hidden>
      <div class="hero">
        <span id="chip" class="chip" hidden></span>
        <h1 id="heading"></h1>
        <p id="subline"></p>
      </div>

      <input type="file" id="file" accept=".srt,.vtt,text/plain" hidden />
      <div id="loadBox">
        <button class="primary" id="pick">SRT 파일 불러오기</button>
        <p class="drop-hint">영상 위나 이 창에 파일을 끌어다 놓아도 돼요</p>
      </div>

      <button class="list-btn" id="panelBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h8M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span id="panelBtnText">자막 목록 열기</span><kbd>T</kbd>
      </button>

      <div class="card" id="syncCard" hidden>
        <div class="card-title">
          <span>싱크 맞추기</span>
          <button class="text-btn" id="reset">초기화</button>
        </div>
        <div class="sync">
          <button class="step" data-d="-1">-1</button>
          <button class="step" data-d="-0.1">-0.1</button>
          <div class="value"><span id="offset">0.0</span><small>초</small></div>
          <button class="step" data-d="0.1">+0.1</button>
          <button class="step" data-d="1">+1</button>
        </div>
        <p class="sync-hint">자막이 빠르면 <b>+</b>, 늦으면 <b>-</b> · 플레이어에서 <kbd>[</kbd> <kbd>]</kbd></p>
      </div>
    </section>


    <!-- 관리자 전용 -->
    <div class="card admin-card" id="adminCard" hidden>
      <div class="card-title"><span>관리자</span><button class="text-btn" id="recheck">다시 확인</button></div>
      <div class="kv">
        <span class="k">콘텐츠 ID</span>
        <span class="v"><span class="mono" id="cid">-</span><button class="copy" id="copyCid">복사</button></span>
      </div>
      <div class="kv">
        <span class="k">공유 자막</span>
        <span class="v"><span class="dot" id="sharedDot"></span><span id="sharedText">확인 중…</span></span>
      </div>
      <div class="admin-actions">
        <button class="accent" id="export">내보내기</button>
        <a id="uploadLink" target="_blank" rel="noopener">subs에 올리기</a>
        <a id="viewLink" target="_blank" rel="noopener" hidden>GitHub에서 보기</a>
      </div>
      <p class="admin-note" id="adminNote"></p>
    </div>

    <!-- 보기 설정 -->
    <div class="card">
      <div class="card-title"><span>보기 설정</span></div>
      <div class="preview" id="preview"><span id="previewText">탄력성은 가격 변화에 대한 반응이에요</span></div>
      <div class="field">
        <div class="field-head"><span>글자 크기</span><output id="fontSizeV"></output></div>
        <input type="range" id="fontSize" min="12" max="48" step="1" />
      </div>
      <div class="field">
        <div class="field-head"><span>자막 위치</span><output id="bottomV"></output></div>
        <input type="range" id="bottom" min="0" max="40" step="1" />
      </div>
      <div class="field">
        <div class="field-head"><span>배경 진하기</span><output id="bgV"></output></div>
        <input type="range" id="bg" min="0" max="1" step="0.05" />
      </div>
    </div>

    <div class="footer" id="clearRow" hidden>
      <button class="danger" id="clear">내 자막 삭제</button>
    </div>

    <p class="copyright">© 2026 AePhroDeChi · <span id="verText">Demo</span></p>
  </main>

  <div class="toast" id="toast"></div>

  <script src="srt.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
